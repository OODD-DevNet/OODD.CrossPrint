name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # 内核四层在 Linux/Windows 上都必须可构建、可测试（SkiaSharp 跨平台渲染内核）。
  portable:
    strategy:
      fail-fast: false
      matrix:
        # 固定 24.04：ubuntu-latest 自 2026-10-19 起滚动迁移到 Ubuntu 26，
        # SkiaSharp/HarfBuzzSharp 原生库的系统依赖与 ABI 会随大版本漂移。
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Ubuntu runner 只有 DejaVu（无 CJK 字形）；FontResolverTests.Cjk_probe 要求回退字体真能画出汉字。
      # 装 fonts-noto-cjk（Noto Sans CJK SC，OFL 许可）让回退链路在 CI 上有可用字体。
      # libfontconfig1 必须显式装：SkiaSharp 的 Linux 原生库动态链接它，旧 runner 镜像自带但新镜像不保证；
      # 缺它时 build 能过、测试进程一加载原生库就退出（表现为 Test 步骤秒失败）。
      - if: runner.os == 'Linux'
        name: Install Linux font deps (libfontconfig1 + CJK fallback fonts)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-noto-cjk
      - name: Build (portable slice)
        run: dotnet build OODD.CrossPrint.Portable.slnf -c Release
      - name: Test
        shell: bash
        run: |
          set +e
          rc=0
          dotnet test tests/CrossPrint.Core.Tests -c Release --no-build --logger "console;verbosity=detailed" > test-core.log 2>&1 || rc=1
          dotnet test tests/CrossPrint.Engine.Tests -c Release --no-build --logger "console;verbosity=detailed" > test-engine.log 2>&1 || rc=1
          dotnet test tests/CrossPrint.Designer.Tests -c Release --no-build --logger "console;verbosity=detailed" > test-designer.log 2>&1 || rc=1
          dotnet test tests/CrossPrint.Printing.Tests -c Release --no-build --logger "console;verbosity=detailed" --filter "Category!=Stress" > test-printing.log 2>&1 || rc=1
          exit $rc
      - if: failure()
        name: Dump test failure
        shell: bash
        run: |
          for f in test-core.log test-engine.log test-designer.log test-printing.log; do
            [ -f "$f" ] || continue
            echo "=== $f (tail) ==="
            tail -40 "$f"
            # 失败用例名与断言写成 annotations：匿名 API 可读，无需 gh 登录即可拿到真因。
            grep -E "\[FAIL\]|Failed!|失败!|Expected |Exception" "$f" | head -20 | while IFS= read -r line; do
              echo "::error::$f: $line"
            done || true
          done
          echo "=== native assets ==="
          # head 提前关闭管道会让 find 收到 SIGPIPE，末尾吞掉退出码避免把诊断步骤自己标红。
          find . \( -name 'libSkiaSharp*' -o -name 'libHarfBuzzSharp*' \) | head -20 || true

  # 宿主适配与样例只在 Windows 上构建（WinForms/WPF 目标不可移植）。
  windows-hosts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build (all shipped hosts + samples)
        run: dotnet build OODD.CrossPrint.slnf -c Release
      - name: Pack
        run: |
          dotnet pack src/CrossPrint.Core -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Engine -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Designer -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Printing -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.Avalonia -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.WinForms -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.Wpf -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.Eto -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.WinUi -c Release -o artifacts/packages
          dotnet pack src/CrossPrint.Hosts.Uno -c Release -o artifacts/packages
      - name: Verify packages (README embedded, count)
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem artifacts/packages/*.nupkg
          if ($pkgs.Count -ne 10) { throw "预期 10 个包，实际 $($pkgs.Count)" }
          foreach ($p in $pkgs) {
            $zip = [IO.Compression.ZipFile]::OpenRead($p.FullName)
            try {
              if (-not ($zip.Entries.FullName -contains "README.md")) { throw "$($p.Name) 未嵌入 README.md" }
            } finally { $zip.Dispose() }
          }
      # Trim smoke：publish Avalonia sample（partial trim），确认本仓库程序集不产生 IL 警告。
      # PowerShell 重定向 > 不会像管道那样改变 $LASTEXITCODE——这里用 > 确保 exit code 正确捕获。
      # 裁剪开关经 -p:TrimSmoke=true 传入（样例 csproj 独享消费）：PublishTrimmed/TrimMode 若用
      # -p: 直传会成为全局属性，压倒 Directory.Build.props 对 net461/netstandard2.0 的兜底，
      # 流进多目标引用工程触发 NETSDK1124（#22~#26 连红的根因，2026-11-05 修复）。
      - name: Trim smoke (Avalonia sample, no AOT)
        shell: pwsh
        run: |
          dotnet publish samples/CrossPrint.Samples.Avalonia -c Release -f net8.0 -r win-x64 `
            "-p:TrimSmoke=true" `
            -o artifacts/trim-avalonia > artifacts/trim.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "trim publish 失败 (exit=$LASTEXITCODE)"
            Get-Content artifacts/trim.log | Select-Object -Last 80
            exit 1
          }
          Write-Output "--- CrossPrint IL warnings (expect 0) ---"
          $ours = Select-String -Path artifacts/trim.log -Pattern 'warning IL\d+:.*\bCrossPrint\.(Core|Engine|Designer|Printing|Hosts)\.'
          if ($ours) {
            $ours | ForEach-Object { Write-Error $_.Line }
            Write-Output "--- full trim log ---"
            Get-Content artifacts/trim.log | Select-Object -Last 100
            throw "本仓库程序集在裁剪下产生了 IL 警告，见上文"
          }
          Write-Output "OK：本仓库程序集在裁剪下无 IL 警告"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-and-trim-log
          path: |
            artifacts/packages/*.nupkg
            artifacts/trim.log
